name: backend-ci

on:
  pull_request:
    branches: [dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [dev]
    paths:
      - "backend/**"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:latest detect --source=/repo -v --redact

      - name: Format check (Spotless)
        run: chmod +x mvnw && ./mvnw -B spotless:check

      - name: Lint (Checkstyle)
        run: ./mvnw -B checkstyle:check

      - name: Unit tests
        run: ./mvnw -B test

      - name: Integration tests
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: ./mvnw -B verify

      - name: Build Docker images (no push)
        run: |
          for entry in "services/auth:auth-service" "services/session:session-service" \
                       "services/distraction:distraction-service" "services/goal:goal-service" \
                       "services/analytics:analytics-service" "services/accountability:accountability-service" \
                       "services/notification:notification-service" "gateway:gateway"; do
            module="${entry%%:*}"
            artifact="${entry##*:}"
            docker build --build-arg MODULE="$module" --build-arg ARTIFACT="$artifact" \
              -f Dockerfile -t "locus/$artifact:ci" .
          done
