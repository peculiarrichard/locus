spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/auth_db
    username: ${DB_USERNAME:auth_service}
    password: ${DB_PASSWORD:auth_service_local}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      sns:
        endpoint: ${AWS_SNS_ENDPOINT:http://localhost:4566}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

locus:
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:admin@locus.local}
  mfa:
    enrollment-ttl-minutes: 15
  password-reset:
    token-ttl-hours: 24
  email-verification:
    token-ttl-hours: 24
    resend-cooldown-seconds: 60
  lockout:
    max-attempts: 5
    window-minutes: 15
    lock-minutes: 30
