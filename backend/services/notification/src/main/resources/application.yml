spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/notification_db
    username: ${DB_USERNAME:notification_service}
    password: ${DB_PASSWORD:notification_service_local}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      sns:
        endpoint: ${AWS_SNS_ENDPOINT:http://localhost:4566}
      sqs:
        endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

locus:
  notification:
    from-address: ${NOTIFICATION_FROM_ADDRESS:noreply@locus.local}
    # Placeholder link bases — a real hosted verification/reset landing page is a frontend/Part 2
    # concern; locally this renders the raw link straight into the email body, visible in Mailpit.
    verification-link-base: ${VERIFICATION_LINK_BASE:http://localhost:8081/auth/verify-email?token=}
    password-reset-link-base: ${PASSWORD_RESET_LINK_BASE:http://localhost:8081/auth/password-reset/confirm?token=}
